# The live image's 99-wildcard.network puts every interface under systemd-networkd with DHCP.
# On a NAS with several NICs and only one cabled, --any means network-online.target is reached
# as soon as one link is configured. Whether the stock (no --any) behaviour would actually
# stall in that case is unverified; --any makes it not matter.
[Service]
ExecStart=
ExecStart=/lib/systemd/systemd-networkd-wait-online --any --timeout=300
